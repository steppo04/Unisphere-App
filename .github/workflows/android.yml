name: Android Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v4

    - name: Configura Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Crea il file local.properties
      run: |
        echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > local.properties
        echo "SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}" >> local.properties

    - name: Dai i permessi a Gradle
      run: chmod +x gradlew

    - name: Compila l'APK (Debug)
      run: ./gradlew assembleDebug

    - name: Salva l'APK come Artifatto
      uses: actions/upload-artifact@v4
      with:
        name: Unisphere-APK
        path: app/build/outputs/apk/debug/app-debug.apk
